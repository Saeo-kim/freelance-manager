
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 상세 | Freelance Manager</title>
    <style>
        body {
            font-family: Arial, "Malgun Gothic", sans-serif;
            background: #f7f7f5;
            color: #29272f;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .panel {
            background: white;
            border: 1px solid #e9e7e3;
            border-radius: 15px;
            padding: 25px;
        }

        input, textarea, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            font: inherit;
            border: 1px solid #deddd8;
            border-radius: 8px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        button {
            background: #29272f;
            color: white;
            cursor: pointer;
        }

        .message {
            color: #765ca7;
        }
    </style>
</head>
<body>
<h1>업무 상세</h1>

<div class="panel">
    <p>업무 ID: <span id="projectId"
                    th:text="${projectId}"></span></p>

    <form id="detailForm">
        <label for="description">업무 설명</label>
        <textarea id="description"
                  placeholder="업무 내용, 진행 상황, 메모를 작성하세요."></textarea>

        <label for="image">이미지 첨부</label>
        <input id="image" type="file" accept="image/*">

        <img id="preview" alt="첨부 이미지 미리보기"
             style="display:none; max-width:100%; margin-bottom:15px;">

        <button type="submit">저장하기</button>
        <p id="message" class="message"></p>
    </form>

    <a href="/">대시보드로 돌아가기</a>
</div>

<script>
    const id = document.getElementById("projectId").textContent.trim();
    const key = "freelance-manager-detail-" + id;
    const description = document.getElementById("description");
    const imageInput = document.getElementById("image");
    const preview = document.getElementById("preview");
    const message = document.getElementById("message");

    let imageData = "";

    try {
        const saved = JSON.parse(localStorage.getItem(key) || "{}");
        description.value = saved.description || "";
        imageData = saved.image || "";

        if (imageData) {
            preview.src = imageData;
            preview.style.display = "block";
        }
    } catch (error) {
        console.error("저장된 내용을 불러오지 못했습니다.", error);
    }

    imageInput.addEventListener("change", () => {
        const file = imageInput.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            alert("이미지 파일을 선택해 주세요.");
            imageInput.value = "";
            return;
        }

        if (file.size > 1024 * 1024) {
            alert("현재는 1MB 이하의 이미지만 첨부할 수 있어요.");
            imageInput.value = "";
            return;
        }

        const reader = new FileReader();

        reader.onload = () => {
            imageData = reader.result;
            preview.src = imageData;
            preview.style.display = "block";
        };

        reader.readAsDataURL(file);
    });

    document.getElementById("detailForm")
        .addEventListener("submit", (event) => {
            event.preventDefault();

            try {
                localStorage.setItem(key, JSON.stringify({
                    description: description.value,
                    image: imageData
                }));
                message.textContent = "저장했어요.";
            } catch (error) {
                message.textContent =
                    "저장에 실패했어요. 이미지 크기를 줄여 다시 시도해 주세요.";
            }
        });
</script>
</body>
</html>
